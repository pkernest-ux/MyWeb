<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panorama Tour | Ernest Huang</title>
    <meta name="description" content="環景照片依編號檢查並以 3D 球面瀏覽。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0b0f17;
        --panel: rgba(17, 24, 39, 0.86);
        --line: rgba(148, 163, 184, 0.22);
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --ok: #34d399;
        --warn: #fbbf24;
        --bad: #f87171;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
      body { display: grid; grid-template-columns: 340px 1fr; height: 100vh; overflow: hidden; }
      aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: #0f1522; }
      .head { padding: 16px; border-bottom: 1px solid var(--line); }
      .head a { color: var(--muted); font-size: 13px; text-decoration: none; }
      h1 { font-size: 18px; margin: 6px 0 12px; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; }
      button, label.btn { font: inherit; font-size: 13px; color: var(--text); background: #1e293b; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
      button:hover, label.btn:hover { border-color: var(--accent); }
      button.on { background: var(--accent); color: #0b0f17; border-color: var(--accent); }
      label.btn input { display: none; }
      .report { padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.55; }
      .report .ok { color: var(--ok); } .report .warn { color: var(--warn); } .report .bad { color: var(--bad); }
      .report ul { margin: 6px 0 0; padding-left: 18px; }
      ol#list { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; }
      ol#list li { display: grid; grid-template-columns: 34px 72px 1fr; gap: 10px; align-items: center; padding: 6px; border-radius: 8px; cursor: pointer; }
      ol#list li:hover { background: rgba(56, 189, 248, 0.08); }
      ol#list li.active { background: rgba(56, 189, 248, 0.18); }
      .idx { font-family: "JetBrains Mono", monospace; color: var(--muted); font-size: 12px; text-align: right; }
      .thumb { width: 72px; height: 36px; object-fit: cover; border-radius: 4px; background: #1e293b; }
      .meta { min-width: 0; font-size: 12px; }
      .meta b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .meta span { color: var(--muted); }
      .meta .warn { color: var(--warn); }
      main { position: relative; min-width: 0; }
      #stage { position: absolute; inset: 0; }
      #stage canvas { display: block; touch-action: none; }
      .hud { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; backdrop-filter: blur(8px); }
      .hud .title { font-size: 13px; padding: 0 8px; min-width: 160px; text-align: center; font-family: "JetBrains Mono", monospace; }
      .empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
      .empty.drag { outline: 2px dashed var(--accent); outline-offset: -16px; }
      .empty p { max-width: 460px; line-height: 1.6; }
      .loading { position: absolute; top: 16px; right: 16px; font-size: 12px; color: var(--muted); background: var(--panel); padding: 6px 10px; border-radius: 8px; display: none; }
      @media (max-width: 800px) {
        body { grid-template-columns: 1fr; grid-template-rows: 44vh 1fr; }
        aside { order: 2; border-right: 0; border-top: 1px solid var(--line); }
        .hud .title { min-width: 0; }
      }
    </style>
  </head>
  <body>
    <aside>
      <div class="head">
        <a href="./index.html">← Ernest Huang</a>
        <h1>環景照片 3D 瀏覽</h1>
        <div class="actions">
          <label class="btn">選擇資料夾<input id="dirInput" type="file" webkitdirectory multiple accept="image/*" /></label>
          <label class="btn">選擇照片<input id="fileInput" type="file" multiple accept="image/*" /></label>
        </div>
      </div>
      <div class="report" id="report">尚未載入照片。照片只在您的瀏覽器中讀取，不會上傳。</div>
      <ol id="list"></ol>
    </aside>
    <main>
      <div id="stage"></div>
      <div class="empty" id="empty">
        <p>將 <b>Photos-1-001</b> 資料夾拖曳到這裡，或點左側「選擇資料夾」。<br />照片會依檔名中的編號排序，並檢查缺號、重複與比例（環景應為 2:1）。</p>
      </div>
      <div class="loading" id="loading">載入中…</div>
      <div class="hud" id="hud" hidden>
        <button id="prev" title="上一張 (←)">◀</button>
        <span class="title" id="title"></span>
        <button id="next" title="下一張 (→)">▶</button>
        <button id="mode" title="切換 環景內部 / 3D 路線總覽">總覽</button>
        <button id="spin" title="自動旋轉">旋轉</button>
        <button id="full" title="全螢幕">⛶</button>
      </div>
    </main>

    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js" } }
    </script>
    <script type="module">
      import * as THREE from "three";

      const IMAGE_RE = /\.(jpe?g|png|webp)$/i;
      const $ = (id) => document.getElementById(id);
      let items = []; // { name, url, num, width, height, thumb }
      let current = -1;
      let mode = "inside"; // inside | overview
      let autoSpin = false;

      // ---------- ordering & checks ----------
      const lastNumber = (name) => {
        const m = name.replace(/\.[^.]+$/, "").match(/(\d+)(?!.*\d)/);
        return m ? parseInt(m[1], 10) : null;
      };
      const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });

      function readSize(url) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
          img.onerror = () => resolve({ width: 0, height: 0 });
          img.src = url;
        });
      }

      async function loadEntries(entries) {
        items.forEach((it) => it.revoke && URL.revokeObjectURL(it.url));
        entries = entries.filter((e) => IMAGE_RE.test(e.name)).sort((a, b) => collator.compare(a.name, b.name));
        if (!entries.length) { $("report").innerHTML = '<span class="bad">找不到 JPG / PNG / WebP 照片。</span>'; return; }
        $("loading").style.display = "block";
        items = await Promise.all(entries.map(async (e) => ({ ...e, num: lastNumber(e.name), ...(await readSize(e.url)) })));
        $("loading").style.display = "none";
        renderReport();
        renderList();
        buildOverview();
        $("empty").hidden = true;
        $("hud").hidden = false;
        show(0);
      }

      function renderReport() {
        const issues = [];
        const nums = items.map((i) => i.num).filter((n) => n !== null);
        const missingNum = items.filter((i) => i.num === null).map((i) => i.name);
        if (missingNum.length) issues.push(`<span class="warn">無編號：</span>${missingNum.join("、")}`);
        const seen = new Map();
        nums.forEach((n) => seen.set(n, (seen.get(n) || 0) + 1));
        const dups = [...seen].filter(([, c]) => c > 1).map(([n]) => n);
        if (dups.length) issues.push(`<span class="bad">重複編號：</span>${dups.join(", ")}`);
        if (nums.length) {
          const min = Math.min(...nums), max = Math.max(...nums), gaps = [];
          for (let n = min; n <= max && gaps.length < 50; n++) if (!seen.has(n)) gaps.push(n);
          if (gaps.length) issues.push(`<span class="bad">缺號：</span>${gaps.join(", ")}`);
        }
        const notPano = items.filter((i) => i.width && Math.abs(i.width / i.height - 2) > 0.05).map((i) => `${i.name} (${i.width}×${i.height})`);
        if (notPano.length) issues.push(`<span class="warn">非 2:1 環景比例：</span>${notPano.join("、")}`);
        const broken = items.filter((i) => !i.width).map((i) => i.name);
        if (broken.length) issues.push(`<span class="bad">無法讀取：</span>${broken.join("、")}`);
        const range = nums.length ? `編號 ${Math.min(...nums)} – ${Math.max(...nums)}` : "";
        $("report").innerHTML = `共 <b>${items.length}</b> 張 ${range}<br />` +
          (issues.length ? `<ul>${issues.map((s) => `<li>${s}</li>`).join("")}</ul>` : '<span class="ok">✓ 編號連續、無重複，全部為 2:1 環景。</span>');
      }

      function renderList() {
        $("list").innerHTML = "";
        items.forEach((it, i) => {
          const li = document.createElement("li");
          const ratioOk = it.width && Math.abs(it.width / it.height - 2) <= 0.05;
          li.innerHTML = `<span class="idx">${String(i + 1).padStart(2, "0")}</span><img class="thumb" loading="lazy" alt="" /><span class="meta"><b></b><span class="${ratioOk ? "" : "warn"}">${it.width ? `${it.width}×${it.height}` : "讀取失敗"}${it.num !== null ? ` · #${it.num}` : ""}</span></span>`;
          li.querySelector("img").src = it.url;
          li.querySelector("b").textContent = it.name;
          li.onclick = () => { if (mode === "overview") setMode("inside"); show(i); };
          $("list").appendChild(li);
        });
      }

      // ---------- three.js viewer ----------
      const stage = $("stage");
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      stage.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 2000);
      const loader = new THREE.TextureLoader();
      const maxAniso = renderer.capabilities.getMaxAnisotropy();

      // inside view: camera at origin, sphere seen from inside
      const panoGeo = new THREE.SphereGeometry(500, 64, 40);
      panoGeo.scale(-1, 1, 1);
      const panoMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const pano = new THREE.Mesh(panoGeo, panoMat);
      scene.add(pano);

      // overview: every panorama as a small textured globe along a path, in numeric order
      const overview = new THREE.Group();
      overview.visible = false;
      scene.add(overview);
      scene.add(new THREE.AmbientLight(0xffffff, 1));
      const globes = [];
      const texCache = new Map();

      function texture(i) {
        if (!texCache.has(i)) {
          const t = loader.load(items[i].url);
          t.colorSpace = THREE.SRGBColorSpace;
          t.anisotropy = maxAniso;
          texCache.set(i, t);
        }
        return texCache.get(i);
      }

      function buildOverview() {
        overview.clear();
        globes.length = 0;
        texCache.forEach((t) => t.dispose());
        texCache.clear();
        const n = items.length, spacing = 3.2, perRow = Math.max(1, Math.ceil(Math.sqrt(n * 2)));
        const pts = [];
        items.forEach((_, i) => {
          const row = Math.floor(i / perRow), col = i % perRow;
          const x = (row % 2 ? perRow - 1 - col : col) * spacing; // serpentine path keeps neighbours adjacent
          const pos = new THREE.Vector3(x - ((perRow - 1) * spacing) / 2, 0, row * spacing);
          pts.push(pos);
          const g = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 24), new THREE.MeshBasicMaterial({ map: texture(i) }));
          g.position.copy(pos);
          g.userData.index = i;
          overview.add(g);
          globes.push(g);
          overview.add(makeLabel(String(i + 1), pos));
        });
        const rows = Math.ceil(n / perRow);
        overview.position.z = -((rows - 1) * spacing) / 2;
        if (pts.length > 1) {
          const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x38bdf8 }));
          overview.add(line);
        }
        overview.userData.radius = Math.max(perRow, rows) * spacing;
      }

      function makeLabel(text, pos) {
        const c = document.createElement("canvas");
        c.width = 128; c.height = 64;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "rgba(15,21,34,.85)"; ctx.fillRect(24, 8, 80, 48);
        ctx.fillStyle = "#e5e7eb"; ctx.font = "bold 32px JetBrains Mono, monospace";
        ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(text, 64, 33);
        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
        s.scale.set(1.2, 0.6, 1);
        s.position.copy(pos).add(new THREE.Vector3(0, 1.5, 0));
        return s;
      }

      function show(i) {
        if (!items.length) return;
        current = (i + items.length) % items.length;
        const it = items[current];
        $("title").textContent = `${current + 1}/${items.length} · ${it.name}`;
        panoMat.map = texture(current);
        panoMat.needsUpdate = true;
        document.querySelectorAll("#list li").forEach((li, k) => li.classList.toggle("active", k === current));
        document.querySelectorAll("#list li")[current]?.scrollIntoView({ block: "nearest" });
        lon = 0; lat = 0; camera.fov = 75; camera.updateProjectionMatrix();
      }

      function setMode(m) {
        mode = m;
        pano.visible = m === "inside";
        overview.visible = m === "overview";
        $("mode").textContent = m === "inside" ? "總覽" : "環景";
        orbit = { theta: 0.6, phi: 0.9, dist: (overview.userData.radius || 10) * 1.1 };
        camera.fov = 55; camera.updateProjectionMatrix();
        if (m === "inside") show(current);
      }

      // ---------- controls ----------
      let lon = 0, lat = 0, orbit = { theta: 0.6, phi: 0.9, dist: 10 };
      let dragging = false, moved = 0, px = 0, py = 0;
      const el = renderer.domElement;
      el.addEventListener("pointerdown", (e) => { dragging = true; moved = 0; px = e.clientX; py = e.clientY; el.setPointerCapture(e.pointerId); });
      el.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const dx = e.clientX - px, dy = e.clientY - py;
        px = e.clientX; py = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
        if (mode === "inside") {
          const k = camera.fov / el.clientHeight;
          lon -= dx * k; lat = THREE.MathUtils.clamp(lat + dy * k, -85, 85);
        } else {
          orbit.theta -= dx * 0.005; orbit.phi = THREE.MathUtils.clamp(orbit.phi - dy * 0.005, 0.1, 1.5);
        }
      });
      el.addEventListener("pointerup", (e) => {
        dragging = false;
        if (mode === "overview" && moved < 5) {
          const r = el.getBoundingClientRect();
          const ray = new THREE.Raycaster();
          ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
          const hit = ray.intersectObjects(globes)[0];
          if (hit) { setMode("inside"); show(hit.object.userData.index); }
        }
      });
      el.addEventListener("wheel", (e) => {
        e.preventDefault();
        if (mode === "inside") { camera.fov = THREE.MathUtils.clamp(camera.fov + e.deltaY * 0.05, 30, 100); camera.updateProjectionMatrix(); }
        else orbit.dist = THREE.MathUtils.clamp(orbit.dist * (1 + e.deltaY * 0.001), 3, 200);
      }, { passive: false });

      $("prev").onclick = () => show(current - 1);
      $("next").onclick = () => show(current + 1);
      $("mode").onclick = () => setMode(mode === "inside" ? "overview" : "inside");
      $("spin").onclick = () => { autoSpin = !autoSpin; $("spin").classList.toggle("on", autoSpin); };
      $("full").onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.querySelector("main").requestFullscreen());
      addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") show(current - 1);
        if (e.key === "ArrowRight") show(current + 1);
      });

      function resize() {
        const w = stage.clientWidth, h = stage.clientHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h; camera.updateProjectionMatrix();
      }
      new ResizeObserver(resize).observe(stage);
      resize();

      renderer.setAnimationLoop(() => {
        if (mode === "inside") {
          if (autoSpin && !dragging) lon += 0.05;
          const phi = THREE.MathUtils.degToRad(90 - lat), theta = THREE.MathUtils.degToRad(lon);
          camera.position.set(0, 0, 0);
          camera.lookAt(Math.sin(phi) * Math.cos(theta), Math.cos(phi), Math.sin(phi) * Math.sin(theta));
        } else {
          if (autoSpin && !dragging) orbit.theta += 0.002;
          camera.position.set(
            orbit.dist * Math.sin(orbit.phi) * Math.sin(orbit.theta),
            orbit.dist * Math.cos(orbit.phi),
            orbit.dist * Math.sin(orbit.phi) * Math.cos(orbit.theta)
          );
          camera.lookAt(0, 0, 0);
          globes.forEach((g) => (g.rotation.y += 0.002));
        }
        renderer.render(scene, camera);
      });

      // ---------- inputs ----------
      const fromFiles = (files) => [...files].map((f) => ({ name: f.name, url: URL.createObjectURL(f), revoke: true }));
      $("dirInput").onchange = (e) => loadEntries(fromFiles(e.target.files));
      $("fileInput").onchange = (e) => loadEntries(fromFiles(e.target.files));

      const drop = $("empty");
      ["dragenter", "dragover"].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("drag"); }));
      document.addEventListener("dragleave", () => drop.classList.remove("drag"));
      document.addEventListener("drop", async (e) => {
        e.preventDefault();
        drop.classList.remove("drag");
        const files = [];
        const walk = (entry) => new Promise((res) => {
          if (entry.isFile) entry.file((f) => { files.push(f); res(); }, res);
          else if (entry.isDirectory) {
            const reader = entry.createReader(), all = [];
            const readAll = () => reader.readEntries(async (batch) => {
              if (batch.length) { all.push(...batch); readAll(); }
              else { await Promise.all(all.map(walk)); res(); }
            }, res);
            readAll();
          } else res();
        });
        const entries = [...e.dataTransfer.items].map((i) => i.webkitGetAsEntry?.()).filter(Boolean);
        if (entries.length) await Promise.all(entries.map(walk));
        else files.push(...e.dataTransfer.files);
        loadEntries(fromFiles(files));
      });

      // Photos published with the site: assets/panorama/manifest.json = ["Photos-1-001/xxx.jpg", ...]
      fetch("./assets/panorama/manifest.json")
        .then((r) => (r.ok ? r.json() : []))
        .then((list) => {
          if (Array.isArray(list) && list.length) loadEntries(list.map((p) => ({ name: p.split("/").pop(), url: "./assets/panorama/" + p })));
        })
        .catch(() => {});
    </script>
  </body>
</html>
